<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="Claude Desktop runs proxy.sh or proxy.ps1 as a local MCP server over stdio. The proxy signs a JWT with the serverless-mcp-proxy-sa key and exchanges it at Google's token endpoint for an ID token, which it caches. Cloud Run IAM checks that the caller holds run.invoker before the request reaches serverless-mcp-func, a single Python 3.11 Cloud Function that routes GET /tools and ten POST /resources/* paths. It runs as its own service account, searching Cloud Asset Inventory with cloudasset.viewer and listing bucket objects with storage.objectViewer."><defs><marker id="a_e_stdio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_asset" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_gcs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs><rect width="1620" height="590" fill="#0d1117"/><path d="M460,95.0 H595" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_stdio)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">MCP stdio</text><path d="M1160,95.0 H1025" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_token)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">ID token</text><path d="M810.0,150 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_https)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">HTTPS + Bearer</text><path d="M810.0,350 V435" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_fn)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">GET /tools, POST /resources/*</text><path d="M600,495.0 H465" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_asset)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">search</text><path d="M1020,495.0 H1155" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_gcs)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">list objects</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Claude Desktop</text><text x="104.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">any MCP client</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#f2c163" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#f2c163" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">proxy.sh / proxy.ps1</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">local MCP server, token cache</text><rect x="1160" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(1180,80.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="1224.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">oauth2.googleapis.com</text><text x="1224.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">proxy-sa-key.json -&gt; ID token</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="664.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cloud Run IAM</text><text x="664.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">run.invoker: serverless-mcp-proxy-sa</text><rect x="40" y="440" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(60,480.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="104.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cloud Asset Inventory</text><text x="104.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">cloudasset.viewer on the project</text><rect x="600" y="440" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><g transform="translate(620,480.0) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="664.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">serverless-mcp-func</text><text x="664.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Python 3.11, 11 routes, func SA</text><rect x="1160" y="440" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(1180,480.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><text x="1224.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cloud Storage</text><text x="1224.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">storage.objectViewer</text></svg>